# Render blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cuni-theses-visualizations
    runtime: docker
    plan: standard  # 2 GB of memory; the app uses 1.0-1.7 GB (measured), so keep one worker
    healthCheckPath: /
    envVars:
      - key: DASH_DEBUG
        value: "0"
